name: Entity Relationship Diagram
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  erd_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --extra docs

      # --check compares the SVG via an embedded hash of the dot source, so graphviz isn't required here
      - name: Check ERD is up to date
        run: uv run envoy-erd --check
